version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhowanee-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: bhowanee
      POSTGRES_USER: bhowanee_dev
      POSTGRES_PASSWORD: bhowanee_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bhowanee_dev -d bhowanee']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
