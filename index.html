<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhowanee - Sign in</title>
<meta name="description" content="Sign in to Bhowanee - the platform connecting farmers, buyers, investors and administrators across Maharashtra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shared.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:28px 24px; background:var(--neutral-bg); }
.login-wrap { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); max-width:1200px; width:100%; border:1px solid var(--border); background:#FFFFFF; min-height:760px; border-radius:16px; overflow:hidden; box-shadow:0 16px 44px rgba(28,36,82,0.12), 0 4px 12px rgba(28,36,82,0.05); }
.login-art { position:relative; background:linear-gradient(165deg, #F4F7FC 0%, #E8EEF8 100%); border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:space-between; align-items:center; text-align:center; padding:36px 32px 30px; overflow:hidden; }
.login-art p { font-family:var(--font-slab); font-weight:600; font-size:20px; line-height:1.4; max-width:20ch; color:var(--dark-blue); margin:0; }
.login-form { padding:36px 48px 36px; display:flex; flex-direction:column; max-width:540px; width:100%; background:#FFFFFF; margin:0 auto; justify-content:center; }
.login-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.wordmark { font-family:var(--font-slab); font-size:24px; font-weight:700; color:var(--dark-blue); }
.roles { list-style:none; margin:16px 0 0; padding:0; border-top:1px solid var(--border); }
.roles li { border-bottom:1px solid var(--border); }
.roles button { display:block; width:100%; text-align:left; background:transparent; border:0; cursor:pointer; padding:12.5px 12px; font:inherit; color:var(--primary-text); transition:all var(--duration) var(--ease); border-radius:6px; }
.roles button:hover { background:var(--brand-blue-light); color:var(--brand-blue); }
.roles button:hover .rn { color:var(--brand-blue); }
.rn { display:block; font-weight:700; font-size:16px; color:var(--dark-blue); }
.rd { display:block; font-size:13.5px; color:var(--secondary-text); margin-top:1.5px; }
.done-box { margin-top:18px; padding:18px; border:1px solid var(--brand-blue); background:var(--brand-blue-subtle); border-radius:8px; font-size:15px; color:var(--dark-blue); }
.done-box b { font-family:var(--font-slab); font-size:19px; display:block; margin-bottom:4px; color:var(--brand-blue); }

/* ── Farmer Animation Styles ───────────────────────────────── */
.farmer-stage {
  width: 100%;
  max-width: 460px;
  margin: 8px 0 6px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
.farmer-svg {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(28,36,82,0.08);
}

@keyframes farmerWave {
  0%   { transform: rotate(0deg); }
  20%  { transform: rotate(-9deg); }
  40%  { transform: rotate(7deg); }
  60%  { transform: rotate(-6deg); }
  80%  { transform: rotate(4deg); }
  100% { transform: rotate(0deg); }
}
@keyframes farmerBreathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.02, 1.03); }
}
@keyframes farmerHeadNod {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50%      { transform: rotate(2.5deg) translateY(-1px); }
}
@keyframes cropSwayL {
  0%   { transform: rotate(0deg); }
  50%  { transform: rotate(5deg); }
  100% { transform: rotate(-4deg); }
}
@keyframes cropSwayR {
  0%   { transform: rotate(0deg); }
  50%  { transform: rotate(-5deg); }
  100% { transform: rotate(4deg); }
}
@keyframes sunGlow {
  0%, 100% { transform: scale(1); opacity: 0.88; }
  50%      { transform: scale(1.08); opacity: 1; }
}
@keyframes cloudDrift1 {
  0%   { transform: translateX(0); }
  50%  { transform: translateX(18px); }
  100% { transform: translateX(0); }
}
@keyframes cloudDrift2 {
  0%   { transform: translateX(0); }
  50%  { transform: translateX(-14px); }
  100% { transform: translateX(0); }
}
@keyframes radarRing {
  0%   { r: 4px; opacity: 0.9; }
  100% { r: 24px; opacity: 0; }
}
@keyframes moteRise {
  0%   { transform: translateY(0); opacity: 0.2; }
  50%  { opacity: 0.9; }
  100% { transform: translateY(-22px); opacity: 0; }
}

.anim-farmer-wave {
  transform-origin: 242px 148px;
  animation: farmerWave 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
}
.anim-farmer-torso {
  transform-origin: 220px 210px;
  animation: farmerBreathe 3.6s ease-in-out infinite;
}
.anim-farmer-head {
  transform-origin: 220px 146px;
  animation: farmerHeadNod 3.6s ease-in-out infinite;
}
.anim-wheat-l1 {
  transform-origin: 45px 270px;
  animation: cropSwayL 3.2s ease-in-out infinite alternate;
}
.anim-wheat-l2 {
  transform-origin: 75px 270px;
  animation: cropSwayL 2.7s ease-in-out infinite alternate;
}
.anim-wheat-r1 {
  transform-origin: 385px 270px;
  animation: cropSwayR 3.4s ease-in-out infinite alternate;
}
.anim-wheat-r2 {
  transform-origin: 415px 270px;
  animation: cropSwayR 2.9s ease-in-out infinite alternate;
}
.anim-sun-core {
  transform-origin: 345px 85px;
  animation: sunGlow 5s ease-in-out infinite;
}
.anim-cloud-1 {
  animation: cloudDrift1 14s ease-in-out infinite;
}
.anim-cloud-2 {
  animation: cloudDrift2 18s ease-in-out infinite;
}
.anim-radar {
  animation: radarRing 2.6s ease-out infinite;
}
.anim-radar-delay {
  animation: radarRing 2.6s ease-out infinite 1.3s;
}
.anim-mote-1 {
  animation: moteRise 4s linear infinite;
}
.anim-mote-2 {
  animation: moteRise 4.8s linear infinite 1.5s;
}
.anim-mote-3 {
  animation: moteRise 4.2s linear infinite 2.5s;
}

.agri-trust-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: var(--brand-blue);
  box-shadow: 0 1px 4px rgba(28,36,82,0.06);
}

@media (max-width:860px) {
  .login-wrap { grid-template-columns: 1fr; max-width: 520px; }
  .login-art { padding: 32px 24px; }
  .login-form { padding: 24px 20px 32px; }
}
</style>
</head>
<body>

            <stop offset="0%" stop-color="#C7DAF0"/>
            <stop offset="100%" stop-color="#B2CAE6"/>
          </linearGradient>
          <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">

        <!-- Foreground Lush Fertile Field -->

          <path d="M72,275 Q70,225 76,185" fill="none" stroke="#8CADDA" stroke-width="2.5"/>

             storage:["गोदाम आणि साठवण","गोदाम नोंदणी, पडताळणी आणि साठवणूक ऑर्डर्स"],
             team:["भवानी टीम","संपूर्ण प्लॅटफॉर्मचे नियंत्रण"]}},
  hi:{title:"साइन इन करें",who:"आप कौन हैं?",mobile:"मोबाइल नंबर",send:"कोड भेजें",call:"फ़ोन करके कोड बताएं",
      code:"6 अंकों का कोड",signin:"साइन इन करें",back:"भूमिका बदलें",email:"ईमेल",pass:"पासवर्ड",cont:"आगे बढ़ें",
      again:"कोड फिर से भेजें",sent:"कोड भेजा गया:",authcode:"ऑथेंटिकेटर कोड",smscode:"SMS कोड भेजा गया",
      roles:{farmer:["किसान","अपनी कीमत तय करें और ऑफर देखें"],block:["ब्लॉक प्रशासक","मानचित्र से अपने ब्लॉक को संभालें"],
             buyer:["खरीदार","लॉट देखें और बोली लगाएं"],investor:["निवेशक","योजनाएं तुलना करें और निवेश करें"],
             logistics:["परिवहन और फ्लीट","वाहन प्रबंधन, रूट शेड्यूलिंग और फील्ड पिकअप"],
             storage:["गोदाम और भंडारण","क्षमता लिस्टिंग, सत्यापन और भंडारण ऑर्डर"],
             team:["भवानी टीम","पूरे प्लेटफ़ॉर्म का नियंत्रण"]}}
};
var MODES  = {farmer:'phone',block:'phone',buyer:'email',investor:'email',logistics:'email',storage:'email',team:'staff'};
var ORDER  = ['farmer','block','buyer','investor','logistics','storage','team'];
var NAMES  = {farmer:'Prakash Sonawane',block:'Admin Dindori',buyer:'Anil Merchant',investor:'Priya Capital',logistics:'Logistics Partner',storage:'Storage Partner',team:'Super Admin'};

var s = {lang:Auth.getLang()||'en', step:'role', role:null, phase:'first', tries:0, locked:false, phone:'', voice:false, err:''};
var body = document.getElementById('loginBody');

function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function render(){
  var t = T[s.lang], h = '';
  if(s.step==='role'){
    h += '<h3 style="font-size:28px">'+t.title+'</h3><p style="margin-top:6px;color:var(--ink-soft)">'+t.who+'</p><ul class="roles">';
    ORDER.forEach(function(r){
      h += '<li><button type="button" data-role="'+r+'"><span class="rn">'+esc(t.roles[r][0])+'</span><span class="rd">'+esc(t.roles[r][1])+'</span></button></li>';
    });
    h += '</ul>';
  } else if(s.step==='done'){
    h += '<h3 style="font-size:26px">'+esc(t.roles[s.role][0])+'</h3>';
    h += '<p class="field-msg ok" style="margin-top:8px;font-size:16px">Signed in successfully.</p>';
    h += '<div class="done-box"><b>Going to your dashboard…</b>Opening '+Auth.routeFor(s.role)+'</div>';
    h += '<div class="stack" style="margin-top:16px"><button type="button" class="btn secondary" data-act="reset">Sign out and try another role</button></div>';
  } else {
    var mode = MODES[s.role];
    h += '<button type="button" class="link-btn" data-act="back" style="margin-bottom:16px">← '+t.back+'</button>';
    h += '<h3 style="font-size:26px">'+esc(t.roles[s.role][0])+'</h3>';
    if(s.locked){
      h += '<p class="alert error" style="margin-top:16px">Too many attempts. '+(mode==='phone'?'Ask your block administrator for help.':'Wait 15 minutes then try again.')+'</p>';
      h += '<div class="stack" style="margin-top:12px"><button type="button" class="btn secondary" data-act="back">'+t.back+'</button></div>';
    } else if(s.phase==='first' && mode==='phone'){
      h += '<form data-form="phone" style="margin-top:20px"><div class="field'+(s.err?' err':'')+'"><label for="lgPhone">'+t.mobile+'</label>';
      h += '<div class="phone-row"><span class="phone-pre">+91</span><input id="lgPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="'+esc(s.phone)+'" aria-describedby="lgMsg"></div></div>';
      h += '<p class="field-msg err" id="lgMsg">'+esc(s.err)+'</p>';
      h += '<div class="stack" style="margin-top:16px"><button class="btn lg block" type="submit">'+t.send+'</button>';
      if(s.role==='farmer') h += '<button class="btn secondary block" type="button" data-act="voice">'+t.call+'</button>';
      h += '</div></form>';
    } else if(s.phase==='first'){
      h += '<form data-form="cred" style="margin-top:20px"><div class="field'+(s.err?' err':'')+'"><label for="lgEmail">'+(mode==='staff'?'Work email':t.email)+'</label><input id="lgEmail" type="email" autocomplete="username" aria-describedby="lgMsg"></div>';
      h += '<div class="field'+(s.err?' err':'')+'"><label for="lgPass">'+t.pass+'</label><input id="lgPass" type="password" autocomplete="current-password" aria-describedby="lgMsg"></div>';
      h += '<p class="field-msg err" id="lgMsg">'+esc(s.err)+'</p>';
      h += '<div class="stack" style="margin-top:16px"><button class="btn lg block" type="submit">'+t.cont+'</button></div></form>';
    } else {
      var masked = mode==='phone' ? '+91 '+s.phone.slice(0,2)+'xxxxxx'+s.phone.slice(-2) : 'your phone';
      var where = mode==='phone'?(s.voice?'A call is coming to '+masked+'. Listen for the code.':t.sent+' '+masked):(mode==='staff'?t.authcode:t.smscode);
      h += '<form data-form="code" style="margin-top:20px"><p style="color:var(--ink-soft);font-size:15px;margin-bottom:16px">'+where+'</p>';
      h += '<div class="field'+(s.err?' err':'')+'"><label for="lgCode">'+t.code+'</label><input id="lgCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-describedby="lgMsg"></div>';
      h += '<p class="field-msg err" id="lgMsg">'+esc(s.err)+'</p>';
      h += '<div class="stack" style="margin-top:16px"><button class="btn lg block" type="submit">'+t.signin+'</button>';
      if(mode==='phone') h += '<button type="button" class="link-btn" data-act="resend">'+t.again+'</button>';
      h += '</div></form>';
    }
  }
  body.innerHTML = h;
  var fi = body.querySelector('input');
  if(fi && s.step==='auth') fi.focus();
}

body.addEventListener('click',function(e){
  var b = e.target.closest('[data-role],[data-act]'); if(!b) return;
  if(b.dataset.role){s.role=b.dataset.role;s.step='auth';s.phase='first';s.tries=0;s.locked=false;s.err='';s.voice=false;s.phone='';render();return;}
  var a = b.dataset.act;
  if(a==='back'){s.step='role';s.role=null;s.err='';s.locked=false;render();}
  else if(a==='reset'){s.step='role';s.role=null;s.err='';s.locked=false;s.tries=0;render();}
  else if(a==='voice'){sendPhone(true);}
  else if(a==='resend'){s.err='';s.tries=0;render();}
});

body.addEventListener('submit',function(e){
  e.preventDefault();
  var kind = e.target.dataset.form;
  if(kind==='phone'){s.phone=(document.getElementById('lgPhone').value||'').replace(/\D/g,'');sendPhone(false);}
  else if(kind==='cred'){
    var em=document.getElementById('lgEmail').value.trim(),pw=document.getElementById('lgPass').value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||pw.length<8){s.err='Enter your email and a password of at least 8 characters.';render();return;}
    s.err='';s.phase='code';s.tries=0;render();
  } else if(kind==='code'){
    var c=(document.getElementById('lgCode').value||'').trim();
    if(c==='123456'){
      Auth.login(s.role, NAMES[s.role], s.phone);
      s.step='done'; s.err=''; render();
      setTimeout(function(){ window.location.href = Auth.routeFor(s.role); }, 1200);
      return;
    }
    s.tries++;
    if(s.tries>=3){s.locked=true;s.err='';}
    else{s.err='That code does not match. '+(3-s.tries)+' tr'+(3-s.tries===1?'y':'ies')+' left.';}
    render();
  }
});

function sendPhone(voice){
  var inp = document.getElementById('lgPhone');
  if(inp) s.phone=(inp.value||'').replace(/\D/g,'');
  if(!/^[6-9]\d{9}$/.test(s.phone)){s.err='Enter a 10-digit mobile number starting with 6, 7, 8 or 9.';render();return;}
  s.err='';s.voice=voice;s.phase='code';s.tries=0;render();
}

// Language toggle
document.querySelectorAll('[data-lang]').forEach(function(btn){
  btn.addEventListener('click',function(){
    s.lang=btn.dataset.lang;
    Auth.setLang(s.lang);
    document.querySelectorAll('[data-lang]').forEach(function(o){o.setAttribute('aria-pressed',o===btn?'true':'false');});
    render();
  });
});

render();

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    window.location.reload();
  });
}
</script>
</body>
</html>
