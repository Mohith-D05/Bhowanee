<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhowanee - Sign in</title>
<meta name="description" content="Sign in to Bhowanee - the platform connecting farmers, buyers, investors and administrators across Maharashtra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shared.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px; background:var(--neutral-bg); }
.login-wrap { display:grid; grid-template-columns:minmax(0,1.24fr) minmax(0,1fr); max-width:1260px; width:100%; border:1px solid var(--border); background:#FFFFFF; min-height:800px; border-radius:18px; overflow:hidden; box-shadow:0 20px 50px rgba(28,36,82,0.12), 0 4px 16px rgba(28,36,82,0.05); }
.login-art { position:relative; background:linear-gradient(168deg, #F5F8FD 0%, #EBF1FA 55%, #DCE6F5 100%); border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:space-between; align-items:center; text-align:center; padding:32px 28px 24px; overflow:hidden; }
.login-art p { font-family:var(--font-slab); font-weight:600; font-size:19px; line-height:1.35; max-width:26ch; color:var(--dark-blue); margin:0; }
.login-form { padding:36px 46px 36px; display:flex; flex-direction:column; max-width:540px; width:100%; background:#FFFFFF; margin:0 auto; justify-content:center; }
.login-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.wordmark { font-family:var(--font-slab); font-size:24px; font-weight:700; color:var(--dark-blue); }
.roles { list-style:none; margin:16px 0 0; padding:0; border-top:1px solid var(--border); }
.roles li { border-bottom:1px solid var(--border); }
.roles button { display:block; width:100%; text-align:left; background:transparent; border:0; cursor:pointer; padding:12px 12px; font:inherit; color:var(--primary-text); transition:all var(--duration) var(--ease); border-radius:6px; }
.roles button:hover { background:var(--brand-blue-light); color:var(--brand-blue); }
.roles button:hover .rn { color:var(--brand-blue); }
.rn { display:block; font-weight:700; font-size:16px; color:var(--dark-blue); }
.rd { display:block; font-size:13.5px; color:var(--secondary-text); margin-top:1.5px; }
.done-box { margin-top:18px; padding:18px; border:1px solid var(--brand-blue); background:var(--brand-blue-subtle); border-radius:8px; font-size:15px; color:var(--dark-blue); }
.done-box b { font-family:var(--font-slab); font-size:19px; display:block; margin-bottom:4px; color:var(--brand-blue); }

/* ── Complete 10s Ecosystem Story Animation ────────────────── */
.ecosystem-stage {
  width: 100%;
  max-width: 580px;
  margin: 10px 0 8px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.ecosystem-svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 10px 24px rgba(28,36,82,0.09));
}

/* 4-Step Synchronized Narrative Stepper */
.eco-stepper {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
  margin-top: 10px;
}
.eco-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 8px;
  background: rgba(255,255,255,0.7);
  border: 1px solid rgba(28,36,82,0.1);
  text-align: center;
  transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
}
.eco-step .step-num {
  font-size: 11px;
  font-weight: 700;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #E2E8F0;
  color: var(--dark-blue);
  display: flex;
  align-items: center;
  justify-content: center;
}
.eco-step .step-txt {
  font-size: 11px;
  font-weight: 600;
  color: var(--dark-blue);
  line-height: 1.2;
}

/* Keyframes for Stepper Synchronization (10s Master Cycle) */
@keyframes step1Sync {
  0%, 23% {
    background: #FFFFFF;
    border-color: var(--brand-blue);
    box-shadow: 0 4px 12px rgba(28,36,82,0.16);
    transform: translateY(-2px);
  }
  25%, 100% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
}
@keyframes step2Sync {
  0%, 24% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
  25%, 48% {
    background: #FFFFFF;
    border-color: var(--brand-blue);
    box-shadow: 0 4px 12px rgba(28,36,82,0.16);
    transform: translateY(-2px);
  }
  50%, 100% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
}
@keyframes step3Sync {
  0%, 49% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
  50%, 73% {
    background: #FFFFFF;
    border-color: var(--brand-blue);
    box-shadow: 0 4px 12px rgba(28,36,82,0.16);
    transform: translateY(-2px);
  }
  75%, 100% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
}
@keyframes step4Sync {
  0%, 74% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
  75%, 98% {
    background: #FFFFFF;
    border-color: #16A34A;
    box-shadow: 0 4px 12px rgba(22,163,74,0.22);
    transform: translateY(-2px);
  }
  100% {
    background: rgba(255,255,255,0.65);
    border-color: rgba(28,36,82,0.1);
    box-shadow: none;
    transform: none;
  }
}

.step-sync-1 { animation: step1Sync 10s ease-in-out infinite; }
.step-sync-2 { animation: step2Sync 10s ease-in-out infinite; }
.step-sync-3 { animation: step3Sync 10s ease-in-out infinite; }
.step-sync-4 { animation: step4Sync 10s ease-in-out infinite; }

/* ── SVG Internal Animations (10s Master Timeline) ────────── */
/* 1. Truck movement from Farm to Warehouse */
@keyframes truckJourney {
  0%, 20% {
    transform: translate(0px, 0px);
  }
  23% {
    transform: translate(15px, 0px);
  }
  46%, 74% {
    transform: translate(165px, -6px);
  }
  78%, 95% {
    transform: translate(165px, -6px);
    opacity: 1;
  }
  97% {
    opacity: 0;
    transform: translate(0px, 0px);
  }
  100% {
    opacity: 1;
    transform: translate(0px, 0px);
  }
}
.anim-truck {
  animation: truckJourney 10s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
}

/* 2. Wheel spinning during truck movement */
@keyframes wheelRoll {
  0%, 20% { transform: rotate(0deg); }
  23% { transform: rotate(180deg); }
  46% { transform: rotate(1620deg); }
  47%, 100% { transform: rotate(1620deg); }
}
.anim-wheel {
  animation: wheelRoll 10s ease-in-out infinite;
}

/* 3. Phase 1: Farmer Ask Price Badge Pop (0% - 24%) */
@keyframes phase1PriceTag {
  0% { opacity: 0; transform: scale(0.6) translateY(8px); }
  4% { opacity: 1; transform: scale(1.05) translateY(-2px); }
  8%, 21% { opacity: 1; transform: scale(1) translateY(0); }
  24% { opacity: 0; transform: scale(0.8) translateY(-4px); }
  25%, 100% { opacity: 0; }
}
.anim-price-tag {
  transform-origin: 42px 12px;
  animation: phase1PriceTag 10s ease-in-out infinite;
}

/* 4. Phase 2: Warehouse Verified Badge (25% - 48%) */
@keyframes phase2WhBadge {
  0%, 24% { opacity: 0; transform: scale(0.6) translateY(8px); }
  28% { opacity: 1; transform: scale(1.04) translateY(-2px); }
  32%, 46% { opacity: 1; transform: scale(1) translateY(0); }
  49% { opacity: 0; transform: scale(0.8) translateY(-4px); }
  50%, 100% { opacity: 0; }
}
.anim-wh-badge {
  transform-origin: 59px 12px;
  animation: phase2WhBadge 10s ease-in-out infinite;
}

/* 5. Phase 3: Digital Marketplace Exchange Board (50% - 74%) */
@keyframes phase3BoardPulse {
  0%, 48% { opacity: 0.45; filter: none; }
  50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(56,189,248,0.5)); }
  54%, 72% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56,189,248,0.35)); }
  75%, 100% { opacity: 0.45; filter: none; }
}
.anim-market-board {
  animation: phase3BoardPulse 10s ease-in-out infinite;
}

@keyframes bidMatchFlash {
  0%, 49% { opacity: 0; transform: scale(0.7); }
  53% { opacity: 1; transform: scale(1.06); }
  56%, 72% { opacity: 1; transform: scale(1); }
  75%, 100% { opacity: 0; }
}
.anim-match-tag {
  transform-origin: 83px 12px;
  animation: bidMatchFlash 10s ease-in-out infinite;
}

/* 6. Phase 4: Escrow Payment Beam & Coins (75% - 98%) */
@keyframes coinFlow1 {
  0%, 74% { opacity: 0; transform: translate(430px, 140px) scale(0.4); }
  76% { opacity: 1; transform: translate(350px, 100px) scale(1); }
  80% { opacity: 1; transform: translate(250px, 110px) scale(1.1); }
  85% { opacity: 1; transform: translate(140px, 160px) scale(1); }
  88% { opacity: 0; transform: translate(85px, 215px) scale(0.5); }
  89%, 100% { opacity: 0; }
}
@keyframes coinFlow2 {
  0%, 76% { opacity: 0; transform: translate(430px, 140px) scale(0.4); }
  79% { opacity: 1; transform: translate(360px, 115px) scale(1); }
  83% { opacity: 1; transform: translate(260px, 125px) scale(1.1); }
  87% { opacity: 1; transform: translate(150px, 175px) scale(1); }
  90% { opacity: 0; transform: translate(85px, 215px) scale(0.5); }
  91%, 100% { opacity: 0; }
}
.anim-coin-1 { animation: coinFlow1 10s ease-in-out infinite; }
.anim-coin-2 { animation: coinFlow2 10s ease-in-out infinite; }

@keyframes phase4PayoutTag {
  0%, 75% { opacity: 0; transform: scale(0.6) translateY(8px); }
  78% { opacity: 1; transform: scale(1.05) translateY(-2px); }
  82%, 96% { opacity: 1; transform: scale(1) translateY(0); }
  99%, 100% { opacity: 0; transform: scale(0.8) translateY(-4px); }
}
.anim-payout-tag {
  transform-origin: 97px 14px;
  animation: phase4PayoutTag 10s ease-in-out infinite;
}

/* 7. Farmer Celebration in Phase 4 */
@keyframes farmerArmsWave {
  0%, 74% { transform: rotate(0deg); }
  76% { transform: rotate(-16deg); }
  80% { transform: rotate(16deg); }
  84% { transform: rotate(-14deg); }
  88% { transform: rotate(14deg); }
  92% { transform: rotate(-8deg); }
  96% { transform: rotate(4deg); }
  98%, 100% { transform: rotate(0deg); }
}
.anim-farmer-r-arm {
  transform-origin: 94px 236px;
  animation: farmerArmsWave 10s ease-in-out infinite;
}

/* Background Micro-Animations */
@keyframes cropSwayL {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(4deg); }
}
@keyframes cropSwayR {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-4deg); }
}
.anim-crop-1 { transform-origin: 25px 330px; animation: cropSwayL 3s ease-in-out infinite; }
.anim-crop-2 { transform-origin: 45px 330px; animation: cropSwayR 3.4s ease-in-out infinite; }

@keyframes iotPulse {
  0% { r: 3px; opacity: 0.9; }
  100% { r: 22px; opacity: 0; }
}
.anim-iot-radar { animation: iotPulse 2.5s ease-out infinite; }

@keyframes roadDash {
  0% { stroke-dashoffset: 28; }
  100% { stroke-dashoffset: 0; }
}
.anim-road-dash { animation: roadDash 1s linear infinite; }

@media (max-width:860px) {
  .login-wrap { grid-template-columns: 1fr; max-width: 520px; }
  .login-art { padding: 30px 20px; }
  .login-form { padding: 24px 20px 32px; }
  .eco-stepper { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="login-wrap">
  <!-- Left brand showcase panel (Fintech Blue Palette + Animated Farmer Scene) -->
  <div class="login-art" aria-hidden="true">
    <div style="display:flex;flex-direction:column;align-items:center;width:100%">
      <div style="position:relative;margin-bottom:12px">
        <img src="logo.png" alt="Bhowanee Logo" style="width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 8px 24px rgba(28,36,82,0.16);border:3.5px solid #FFFFFF;display:block">
      </div>
      <h1 style="font-family:var(--font-slab);font-size:32px;font-weight:700;color:var(--dark-blue);letter-spacing:-0.5px;margin:0 0 6px;line-height:1.1">Bhowanee</h1>
      <p style="font-size:18px">Let&#39;s celebrate agriculture together.</p>
    </div>
    <!-- 10-Second Complete Agricultural Pipeline Story Animation -->
    <div class="ecosystem-stage">
      <svg class="ecosystem-svg" viewBox="0 0 540 330" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyAtmosphere" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E2EDFA"/>
            <stop offset="65%" stop-color="#EFF5FC"/>
            <stop offset="100%" stop-color="#F8FAFE"/>
          </linearGradient>
          <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#C7DAF0"/>
            <stop offset="100%" stop-color="#B2CAE6"/>
          </linearGradient>
          <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8CADDA"/>
            <stop offset="100%" stop-color="#6E93C6"/>
          </linearGradient>
          <linearGradient id="farmFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2D4878"/>
            <stop offset="100%" stop-color="#1C2452"/>
          </linearGradient>
          <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFF2BF"/>
            <stop offset="60%" stop-color="#FCD34D"/>
            <stop offset="100%" stop-color="#F59E0B"/>
          </linearGradient>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="50%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#D97706"/>
          </linearGradient>
          <linearGradient id="dhotiGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E2E8F0"/>
          </linearGradient>
          <filter id="dropSh" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1C2452" flood-opacity="0.18"/>
          </filter>
        </defs>

        <!-- Sky Background Canvas -->
        <rect width="540" height="330" rx="14" fill="url(#skyAtmosphere)"/>

        <!-- Morning Sun with Ambient Glow -->
        <circle cx="270" cy="74" r="44" fill="#FDE68A" opacity="0.3"/>
        <circle cx="270" cy="74" r="28" fill="url(#sunGrad)"/>

        <!-- Distant Digital Hills & Cadastral GIS Polygons -->
        <path d="M0,170 Q135,135 270,160 T540,150 L540,330 L0,330 Z" fill="url(#hillBack)" opacity="0.65"/>
        <path d="M0,195 Q140,170 280,190 T540,180 L540,330 L0,330 Z" fill="url(#hillMid)"/>
        <!-- Cadastral Land Boundary Grid Lines -->
        <path d="M20,205 Q180,185 360,208" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
        <path d="M120,185 L140,215 M250,190 L265,220 M380,195 L400,225" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>

        <!-- Foreground Fertile Farmland Terraces -->
        <path d="M0,225 Q90,205 185,235 L185,330 L0,330 Z" fill="url(#farmFront)"/>
        <path d="M15,255 Q90,240 170,265" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>

        <!-- Top Pipeline Badge -->
        <g transform="translate(175, 14)">
          <rect x="0" y="0" width="190" height="22" rx="11" fill="rgba(255,255,255,0.92)" stroke="rgba(28,36,82,0.12)"/>
          <circle cx="13" cy="11" r="3.5" fill="#16A34A"/>
          <text x="24" y="15" font-size="10.5" font-weight="700" fill="#1C2452" font-family="'Google Sans',sans-serif">Connected Agri Pipeline</text>
        </g>

        <!-- ── ZONE 1: FARMER PRAKASH & CULTIVATION ────────────── -->
        <!-- IoT Cadastral Farm Sensor Pole -->
        <g transform="translate(32, 238)">
          <line x1="0" y1="0" x2="0" y2="28" stroke="#FFFFFF" stroke-width="2.2"/>
          <rect x="-6" y="-5" width="12" height="7" rx="1.5" fill="#334155"/>
          <circle cx="0" cy="-7" r="3.5" fill="#22C55E"/>
          <circle cx="0" cy="-7" r="8" fill="none" stroke="#22C55E" stroke-width="1.2" class="anim-iot-radar"/>
          <circle cx="0" cy="-7" r="16" fill="none" stroke="#38BDF8" stroke-width="1" class="anim-iot-radar" style="animation-delay:1.25s"/>
        </g>

        <!-- Swaying Wheat Stalks -->
        <g class="anim-crop-1">
          <path d="M18,330 Q22,280 26,245" fill="none" stroke="#7A9BC2" stroke-width="2"/>
          <path d="M26,245 Q30,232 26,220 Q22,232 26,245" fill="url(#goldGrad)"/>
          <path d="M26,228 L30,222 M26,224 L32,216" stroke="#D97706" stroke-width="1.2" stroke-linecap="round"/>
        </g>
        <g class="anim-crop-2">
          <path d="M42,330 Q44,285 48,252" fill="none" stroke="#8CADDA" stroke-width="2"/>
          <path d="M48,252 Q52,238 48,226 Q44,238 48,252" fill="url(#goldGrad)"/>
        </g>

        <!-- Farmer Prakash Character -->
        <g id="farmerGroup">
          <!-- Shadow -->
          <ellipse cx="88" cy="308" rx="24" ry="5" fill="rgba(17,23,54,0.3)"/>
          <!-- Dhoti Legs -->
          <path d="M80,268 L76,305 L84,305 L86,275 L90,275 L92,305 L100,305 L96,268 Z" fill="url(#dhotiGrad)"/>
          <rect x="74" y="303" width="12" height="4" rx="1.5" fill="#5D4037"/>
          <rect x="90" y="303" width="12" height="4" rx="1.5" fill="#5D4037"/>

          <!-- Kurta Body & Navy Waistcoat -->
          <path d="M78,226 L98,226 L102,272 L74,272 Z" fill="#FFFFFF"/>
          <path d="M78,226 L88,226 L88,270 L75,270 Z" fill="#1C2452"/>
          <path d="M88,226 L98,226 L101,270 L88,270 Z" fill="#151B3E"/>
          <circle cx="88" cy="238" r="1.5" fill="#D99A06"/>
          <circle cx="88" cy="247" r="1.5" fill="#D99A06"/>
          <circle cx="88" cy="256" r="1.5" fill="#D99A06"/>

          <!-- Left Arm holding crop sheaf -->
          <path d="M78,230 L68,245 L73,260 L78,257" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="73" cy="259" r="3.5" fill="#E0A97E"/>
          <g transform="translate(63, 238) rotate(-16)">
            <path d="M10,25 Q7,12 6,0" fill="none" stroke="#D97706" stroke-width="1.6"/>
            <path d="M6,0 Q9,-9 6,-18 Q3,-9 6,0" fill="url(#goldGrad)"/>
          </g>

          <!-- Right Arm (Animated: Wave in Phase 1, Victorious Celebration in Phase 4) -->
          <g class="anim-farmer-r-arm">
            <path d="M98,230 L108,218 L114,204" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M97,227 Q105,228 105,236 L97,238 Z" fill="#151B3E"/>
            <circle cx="115" cy="202" r="4" fill="#E0A97E"/>
            <path d="M113,198 L114,192 M116,198 L118,193 M118,200 L121,196" stroke="#E0A97E" stroke-width="1.8" stroke-linecap="round"/>
          </g>

          <!-- Head & Maharashtrian Turban (Pheta) -->
          <rect x="85" y="219" width="6" height="8" fill="#E0A97E"/>
          <ellipse cx="88" cy="211" rx="9.5" ry="11" fill="#E0A97E"/>
          <circle cx="84.5" cy="209" r="1.2" fill="#1C2452"/>
          <circle cx="91.5" cy="209" r="1.2" fill="#1C2452"/>
          <!-- Smiling mouth -->
          <path d="M86,217 Q88,220 90,217" fill="none" stroke="#8E4A32" stroke-width="1.2" stroke-linecap="round"/>
          <!-- Blue Pheta Turban with Gold Plume -->
          <path d="M77,206 Q88,190 99,206 Q102,200 98,195 Q88,187 78,195 Q74,200 77,206 Z" fill="#1C2452"/>
          <path d="M78,205 Q88,199 98,205" fill="none" stroke="#D99A06" stroke-width="1.8"/>
          <!-- Turra plume -->
          <path d="M94,194 Q98,183 96,179 Q91,184 90,194 Z" fill="#1C2452"/>
          <path d="M94,192 Q97,184 95,181" fill="none" stroke="#D99A06" stroke-width="1.2"/>
        </g>

        <!-- Phase 1 Floating Price Tag (0s - 2.5s) -->
        <g transform="translate(52, 168)">
          <g class="anim-price-tag">
            <rect width="84" height="25" rx="12.5" fill="#FFFFFF" stroke="#1C2452" stroke-width="1.5" filter="url(#dropSh)"/>
            <circle cx="13" cy="12.5" r="4.5" fill="#16A34A"/>
            <text x="23" y="16.5" font-size="10" font-weight="700" fill="#1C2452" font-family="'Google Sans',sans-serif">Ask ₹2,100</text>
          </g>
        </g>

<script src="data.js"></script>
<script src="auth.js"></script>
<script>
/* ── Translations ─────────────────────────────────────────── */
var T = {
  en:{title:"Sign in",who:"Who are you?",mobile:"Mobile number",send:"Send code",call:"Call me with the code",
      code:"6-digit code",signin:"Sign in",back:"Change role",email:"Email",pass:"Password",cont:"Continue",
      again:"Send code again",sent:"Code sent to",authcode:"Code from your authenticator app",smscode:"SMS code sent to your phone",
      roles:{farmer:["Farmer","Set your price and see offers"],block:["Block administrator","Manage your block from the map"],
             buyer:["Buyer","Browse lots and place bids"],investor:["Investor","Compare plans and invest"],
             logistics:["Logistics Partner","Multi-vehicle fleet routing & pickup dispatch"],
             storage:["Storage & Warehouse","List capacity, request verification & get storage orders"],
             team:["Bhowanee team","Control room for the whole platform"]}},
  mr:{title:"साइन इन करा",who:"तुम्ही कोण आहात?",mobile:"मोबाईल नंबर",send:"कोड पाठवा",call:"मला फोन करून कोड सांगा",
      code:"६ अंकी कोड",signin:"साइन इन करा",back:"भूमिका बदला",email:"ईमेल",pass:"पासवर्ड",cont:"पुढे जा",
      again:"कोड पुन्हा पाठवा",sent:"कोड पाठवला:",authcode:"ऑथेंटिकेटर कोड",smscode:"SMS कोड पाठवला",
      roles:{farmer:["शेतकरी","तुमची किंमत ठरवा आणि ऑफर पहा"],block:["ब्लॉक प्रशासक","नकाशावरून तुमचा ब्लॉक सांभाळा"],
             buyer:["खरेदीदार","लॉट पहा आणि बोली लावा"],investor:["गुंतवणूकदार","योजना तुलना करा आणि गुंतवणूक करा"],
             logistics:["वाहतूक आणि ताफा","वाहने, मार्ग नियोजन आणि थेट शेतावरून उचल"],
             storage:["गोदाम आणि साठवण","गोदाम नोंदणी, पडताळणी आणि साठवणूक ऑर्डर्स"],
             team:["भवानी टीम","संपूर्ण प्लॅटफॉर्मचे नियंत्रण"]}},
  hi:{title:"साइन इन करें",who:"आप कौन हैं?",mobile:"मोबाइल नंबर",send:"कोड भेजें",call:"फ़ोन करके कोड बताएं",
      code:"6 अंकों का कोड",signin:"साइन इन करें",back:"भूमिका बदलें",email:"ईमेल",pass:"पासवर्ड",cont:"आगे बढ़ें",
      again:"कोड फिर से भेजें",sent:"कोड भेजा गया:",authcode:"ऑथेंटिकेटर कोड",smscode:"SMS कोड भेजा गया",
      roles:{farmer:["किसान","अपनी कीमत तय करें और ऑफर देखें"],block:["ब्लॉक प्रशासक","मानचित्र से अपने ब्लॉक को संभालें"],
             buyer:["खरीदार","लॉट देखें और बोली लगाएं"],investor:["निवेशक","योजनाएं तुलना करें और निवेश करें"],
             logistics:["परिवहन और फ्लीट","वाहन प्रबंधन, रूट शेड्यूलिंग और फील्ड पिकअप"],
             storage:["गोदाम और भंडारण","क्षमता लिस्टिंग, सत्यापन और भंडारण ऑर्डर"],
             team:["भवानी टीम","पूरे प्लेटफ़ॉर्म का नियंत्रण"]}}
};
var MODES  = {farmer:'phone',block:'phone',buyer:'email',investor:'email',logistics:'email',storage:'email',team:'staff'};
var ORDER  = ['farmer','block','buyer','investor','logistics','storage','team'];
var NAMES  = {farmer:'Prakash Sonawane',block:'Admin Dindori',buyer:'Anil Merchant',investor:'Priya Capital',logistics:'Logistics Partner',storage:'Storage Partner',team:'Super Admin'};

var s = {lang:Auth.getLang()||'en', step:'role', role:null, phase:'first', tries:0, locked:false, phone:'', voice:false, err:''};
var body = document.getElementById('loginBody');

function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function render(){
  var t = T[s.lang], h = '';
  if(s.step==='role'){
    h += '<h3 style="font-size:28px">'+t.title+'</h3><p style="margin-top:6px;color:var(--ink-soft)">'+t.who+'</p><ul class="roles">';
    ORDER.forEach(function(r){
      h += '<li><button type="button" data-role="'+r+'"><span class="rn">'+esc(t.roles[r][0])+'</span><span class="rd">'+esc(t.roles[r][1])+'</span></button></li>';
    });
    h += '</ul>';
  } else if(s.step==='done'){
    h += '<h3 style="font-size:26px">'+esc(t.roles[s.role][0])+'</h3>';
    h += '<p class="field-msg ok" style="margin-top:8px;font-size:16px">Signed in successfully.</p>';
    h += '<div class="done-box"><b>Going to your dashboard…</b>Opening '+Auth.routeFor(s.role)+'</div>';
    h += '<div class="stack" style="margin-top:16px"><button type="button" class="btn secondary" data-act="reset">Sign out and try another role</button></div>';
  } else {
    var mode = MODES[s.role];
    h += '<button type="button" class="link-btn" data-act="back" style="margin-bottom:16px">← '+t.back+'</button>';
    h += '<h3 style="font-size:26px">'+esc(t.roles[s.role][0])+'</h3>';
    if(s.locked){
      h += '<p class="alert error" style="margin-top:16px">Too many attempts. '+(mode==='phone'?'Ask your block administrator for help.':'Wait 15 minutes then try again.')+'</p>';
      h += '<div class="stack" style="margin-top:12px"><button type="button" class="btn secondary" data-act="back">'+t.back+'</button></div>';
    } else if(s.phase==='first' && mode==='phone'){
      h += '<form data-form="phone" style="margin-top:20px"><div class="field'+(s.err?' err':'')+'"><label for="lgPhone">'+t.mobile+'</label>';
      h += '<div class="phone-row"><span class="phone-pre">+91</span><input id="lgPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="'+esc(s.phone)+'" aria-describedby="lgMsg"></div></div>';
      h += '<p class="field-msg err" id="lgMsg">'+esc(s.err)+'</p>';
      h += '<div class="stack" style="margin-top:16px"><button class="btn lg block" type="submit">'+t.send+'</button>';
      if(s.role==='farmer') h += '<button class="btn secondary block" type="button" data-act="voice">'+t.call+'</button>';
      h += '</div></form>';
    } else if(s.phase==='first'){
      h += '<form data-form="cred" style="margin-top:20px"><div class="field'+(s.err?' err':'')+'"><label for="lgEmail">'+(mode==='staff'?'Work email':t.email)+'</label><input id="lgEmail" type="email" autocomplete="username" aria-describedby="lgMsg"></div>';
      h += '<div class="field'+(s.err?' err':'')+'"><label for="lgPass">'+t.pass+'</label><input id="lgPass" type="password" autocomplete="current-password" aria-describedby="lgMsg"></div>';
      h += '<p class="field-msg err" id="lgMsg">'+esc(s.err)+'</p>';
      h += '<div class="stack" style="margin-top:16px"><button class="btn lg block" type="submit">'+t.cont+'</button></div></form>';
    } else {
      var masked = mode==='phone' ? '+91 '+s.phone.slice(0,2)+'xxxxxx'+s.phone.slice(-2) : 'your phone';
      var where = mode==='phone'?(s.voice?'A call is coming to '+masked+'. Listen for the code.':t.sent+' '+masked):(mode==='staff'?t.authcode:t.smscode);
      h += '<form data-form="code" style="margin-top:20px"><p style="color:var(--ink-soft);font-size:15px;margin-bottom:16px">'+where+'</p>';
      h += '<div class="field'+(s.err?' err':'')+'"><label for="lgCode">'+t.code+'</label><input id="lgCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-describedby="lgMsg"></div>';
      h += '<p class="field-msg err" id="lgMsg">'+esc(s.err)+'</p>';
      h += '<div class="stack" style="margin-top:16px"><button class="btn lg block" type="submit">'+t.signin+'</button>';
      if(mode==='phone') h += '<button type="button" class="link-btn" data-act="resend">'+t.again+'</button>';
      h += '</div></form>';
    }
  }
  body.innerHTML = h;
  var fi = body.querySelector('input');
  if(fi && s.step==='auth') fi.focus();
}

body.addEventListener('click',function(e){
  var b = e.target.closest('[data-role],[data-act]'); if(!b) return;
  if(b.dataset.role){s.role=b.dataset.role;s.step='auth';s.phase='first';s.tries=0;s.locked=false;s.err='';s.voice=false;s.phone='';render();return;}
  var a = b.dataset.act;
  if(a==='back'){s.step='role';s.role=null;s.err='';s.locked=false;render();}
  else if(a==='reset'){s.step='role';s.role=null;s.err='';s.locked=false;s.tries=0;render();}
  else if(a==='voice'){sendPhone(true);}
  else if(a==='resend'){s.err='';s.tries=0;render();}
});

body.addEventListener('submit',function(e){
  e.preventDefault();
  var kind = e.target.dataset.form;
  if(kind==='phone'){s.phone=(document.getElementById('lgPhone').value||'').replace(/\D/g,'');sendPhone(false);}
  else if(kind==='cred'){
    var em=document.getElementById('lgEmail').value.trim(),pw=document.getElementById('lgPass').value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)||pw.length<8){s.err='Enter your email and a password of at least 8 characters.';render();return;}
    s.err='';s.phase='code';s.tries=0;render();
  } else if(kind==='code'){
    var c=(document.getElementById('lgCode').value||'').trim();
    if(c==='123456'){
      Auth.login(s.role, NAMES[s.role], s.phone);
      s.step='done'; s.err=''; render();
      setTimeout(function(){ window.location.href = Auth.routeFor(s.role); }, 1200);
      return;
    }
    s.tries++;
    if(s.tries>=3){s.locked=true;s.err='';}
    else{s.err='That code does not match. '+(3-s.tries)+' tr'+(3-s.tries===1?'y':'ies')+' left.';}
    render();
  }
});

function sendPhone(voice){
  var inp = document.getElementById('lgPhone');
  if(inp) s.phone=(inp.value||'').replace(/\D/g,'');
  if(!/^[6-9]\d{9}$/.test(s.phone)){s.err='Enter a 10-digit mobile number starting with 6, 7, 8 or 9.';render();return;}
  s.err='';s.voice=voice;s.phase='code';s.tries=0;render();
}

// Language toggle
document.querySelectorAll('[data-lang]').forEach(function(btn){
  btn.addEventListener('click',function(){
    s.lang=btn.dataset.lang;
    Auth.setLang(s.lang);
    document.querySelectorAll('[data-lang]').forEach(function(o){o.setAttribute('aria-pressed',o===btn?'true':'false');});
    render();
  });
});

render();

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    window.location.reload();
  });
}
</script>
